<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LocalLens</title>
<meta name="description" content="Happy hours and food & drink deals near SMU, checked against each restaurant's own site.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23c2410c'/><circle cx='16' cy='16' r='6' fill='%23faf7f2'/></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --ink: #1d1b18; --muted: #6b655c; --line: #e8e2d8;
    --accent: #c2410c; --accent-soft: #fde7da; --live: #15803d; --live-soft: #dcfce7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151412; --card: #1f1d1a; --ink: #f2eee8; --muted: #a39d93; --line: #34312c;
      --accent: #fb923c; --accent-soft: #3b2417; --live: #4ade80; --live-soft: #14301f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 16px 8px; max-width: 760px; margin: 0 auto; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .controls { position: sticky; top: 0; z-index: 500; background: var(--bg); padding: 8px 16px 10px;
    max-width: 760px; margin: 0 auto; border-bottom: 1px solid var(--line); }
  .row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .row + .row { margin-top: 8px; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  select, input[type=search] { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); border-radius: 999px; padding: 6px 12px; min-width: 0; }
  input[type=search] { flex: 1; }
  main { max-width: 760px; margin: 0 auto; padding: 12px 16px 40px; }
  .count { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .vhead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .vname { font-weight: 650; font-size: 17px; }
  .hood { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .deal { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 10px; }
  .deal:first-of-type { border-top: 0; margin-top: 6px; padding-top: 0; }
  .when { font-size: 14px; font-weight: 600; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 7px; margin-left: 6px; }
  .live { background: var(--live-soft); color: var(--live); }
  .soon { background: var(--accent-soft); color: var(--accent); }
  .what { margin-top: 2px; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .meta a, .links a { color: var(--muted); }
  .links { margin-top: 10px; font-size: 13px; display: flex; gap: 14px; }
  #map { height: 70vh; border-radius: 14px; border: 1px solid var(--line); display: none; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  footer { max-width: 760px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 12px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Local<span>Lens</span></h1>
  <div class="sub" id="sub">Deals near SMU</div>
</header>

<div class="controls">
  <div class="row" id="when">
    <button class="chip" data-when="now" aria-pressed="true">Happening now</button>
    <button class="chip" data-when="today" aria-pressed="false">Today</button>
    <button class="chip" data-when="all" aria-pressed="false">All week</button>
    <button class="chip" id="mapToggle" aria-pressed="false">Map</button>
  </div>
  <div class="row">
    <button class="chip" id="food" aria-pressed="false">Food</button>
    <button class="chip" id="drink" aria-pressed="false">Drinks</button>
    <select id="hood" aria-label="Neighborhood"><option value="">All areas</option></select>
  </div>
  <div class="row">
    <input type="search" id="q" placeholder="Search places or deals" aria-label="Search venues and deals">
  </div>
</div>

<main>
  <div class="count" id="count"></div>
  <div id="map"></div>
  <div id="list"></div>
</main>

<footer>
  Deals are pulled from each restaurant's own website and re-checked on the date shown. Places change their specials, so confirm before you go.
  <span id="report"></span><br>
  Venue data © <a href="https://overturemaps.org">Overture Maps Foundation</a> and
  © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="time.js"></script>
<script>
const REPORT_URL = "";  // e.g. a Google Form link; the "report a wrong deal" link stays hidden until set

const state = { when: "now", food: false, drink: false, hood: "", q: "", map: false };
const qWhen = new URLSearchParams(location.search).get("when");  // shareable ?when=today|all
if (["now", "today", "all"].includes(qWhen)) state.when = qWhen;
let venues = [], map, layer;

// Current day + minutes in Dallas regardless of the viewer's phone timezone.
function dallasNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Chicago", weekday: "short", hour: "numeric", minute: "numeric", hourCycle: "h23",
  }).formatToParts(new Date()).map(x => [x.type, x.value]));
  return { day: DAYS.indexOf(p.weekday), min: (+p.hour % 24) * 60 + +p.minute };
}

function fmt(min) {
  min %= 1440;
  const h = Math.floor(min / 60), m = min % 60, ap = h < 12 ? "am" : "pm", h12 = h % 12 || 12;
  return m ? `${h12}:${String(m).padStart(2, "0")}${ap}` : `${h12}${ap}`;
}

function whenText(d) {
  const days = d.days.length === 7 ? "Every day" : d.days.length === 5 && !d.days.includes("Sat") && !d.days.includes("Sun")
    ? "Weekdays" : d.days.join(", ");
  const s = toMin(d.start), e = toMin(d.end);
  let t = d.all_day ? "all day" : "times not listed";
  if (s != null && e != null) t = `${fmt(s)}–${fmt(e)}`;
  else if (s != null) t = d.until_close ? `${fmt(s)}–close` : `from ${fmt(s)}`;
  else if (e != null) t = `until ${fmt(e)}`;
  return `${days} · ${t}`;
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const shortDate = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });

function visible() {
  const now = dallasNow(), q = state.q.toLowerCase();
  const out = [];
  for (const v of venues) {
    if (state.hood && v.neighborhood !== state.hood) continue;
    const deals = v.deals.filter(d => {
      if (state.food && !d.food) return false;
      if (state.drink && !d.drink) return false;
      if (q && !`${v.name} ${d.title} ${d.summary}`.toLowerCase().includes(q)) return false;
      d._live = liveFor(d, now);
      d._soon = startsIn(d, now);
      if (state.when === "now") return d._live != null;
      if (state.when === "today") return d._live != null || d._soon != null || d.days.includes(DAYS[now.day]);
      return true;
    });
    if (deals.length) out.push({ v, deals });
  }
  const rank = ({ deals }) => {
    const live = deals.filter(d => d._live != null).map(d => d._live);
    const soon = deals.filter(d => d._soon != null).map(d => d._soon);
    return live.length ? Math.min(...live) : soon.length ? 10000 + Math.min(...soon) : 20000;
  };
  return out.sort((a, b) => rank(a) - rank(b) || a.v.name.localeCompare(b.v.name));
}

function render() {
  const rows = visible();
  const nDeals = rows.reduce((n, r) => n + r.deals.length, 0);
  const label = { now: "on right now", today: "today", all: "this week" }[state.when];
  document.getElementById("count").textContent = `${nDeals} deal${nDeals === 1 ? "" : "s"} at ${rows.length} place${rows.length === 1 ? "" : "s"} ${label}`;

  document.getElementById("list").innerHTML = rows.length ? rows.map(({ v, deals }) => `
    <article class="card">
      <div class="vhead"><div class="vname">${esc(v.name)}</div><div class="hood">${esc(v.neighborhood)}</div></div>
      ${deals.map(d => `
        <div class="deal">
          <div class="when">${esc(whenText(d))}${d._live != null ? `<span class="badge live">${d._live <= 60 ? `ends in ${d._live}m` : "on now"}</span>`
            : d._soon != null && state.when !== "all" ? `<span class="badge soon">in ${d._soon < 60 ? d._soon + "m" : Math.round(d._soon / 60) + "h"}</span>` : ""}</div>
          <div class="what"><strong>${esc(d.title)}</strong> — ${esc(d.summary)}</div>
          <div class="meta">${[d.where, d.food && d.drink ? "food & drinks" : d.food ? "food" : d.drink ? "drinks" : ""].filter(Boolean).map(esc).join(" · ")}
            ${d.food || d.drink || d.where ? " · " : ""}checked ${esc(shortDate(v.checked))} · <a href="${esc(d.source_url)}" target="_blank" rel="noopener">source</a></div>
        </div>`).join("")}
      <div class="links">
        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v.name + " " + (v.address || "Dallas TX"))}" target="_blank" rel="noopener">Directions</a>
        ${v.website ? `<a href="${esc(v.website)}" target="_blank" rel="noopener">Website</a>` : ""}
      </div>
    </article>`).join("")
    : `<div class="empty">Nothing ${label} with these filters.${state.when === "now" ? " Try “Today”." : ""}</div>`;

  if (state.map) drawMap(rows);
}

function drawMap(rows) {
  if (!map) {
    map = L.map("map").setView([32.83, -96.785], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    }).addTo(map);
  }
  if (layer) layer.remove();
  layer = L.layerGroup(rows.map(({ v, deals }) => L.circleMarker([v.lat, v.lon], {
    radius: 8, weight: 2, color: "#fff", fillOpacity: 0.95,
    fillColor: deals.some(d => d._live != null) ? "#15803d" : "#c2410c",
  }).bindPopup(`<strong>${esc(v.name)}</strong><br>${deals.map(d => `${esc(d.title)}: ${esc(whenText(d))}`).join("<br>")}`))).addTo(map);
  if (rows.length) map.fitBounds(L.latLngBounds(rows.map(({ v }) => [v.lat, v.lon])), { padding: [24, 24], maxZoom: 15 });
  setTimeout(() => map.invalidateSize(), 0);
}

function press(btn, on) { btn.setAttribute("aria-pressed", String(on)); }

document.querySelectorAll("[data-when]").forEach(b => b.onclick = () => {
  state.when = b.dataset.when;
  document.querySelectorAll("[data-when]").forEach(x => press(x, x === b));
  render();
});
document.getElementById("mapToggle").onclick = e => {
  state.map = !state.map; press(e.target, state.map);
  document.getElementById("map").style.display = state.map ? "block" : "none";
  document.getElementById("list").style.display = state.map ? "none" : "block";
  render();
};
for (const k of ["food", "drink"]) document.getElementById(k).onclick = e => { state[k] = !state[k]; press(e.target, state[k]); render(); };
document.getElementById("hood").onchange = e => { state.hood = e.target.value; render(); };
document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };
if (REPORT_URL) document.getElementById("report").innerHTML = ` <a href="${esc(REPORT_URL)}" target="_blank" rel="noopener">Report a wrong deal</a>.`;

document.querySelectorAll("[data-when]").forEach(x => press(x, x.dataset.when === state.when));

fetch("deals.json").then(r => r.json()).then(data => {
  venues = data.venues;
  document.getElementById("sub").textContent = `Deals near SMU · ${venues.length} places · updated ${shortDate(data.updated)}`;
  const hoods = [...new Set(venues.map(v => v.neighborhood))].sort();
  document.getElementById("hood").insertAdjacentHTML("beforeend", hoods.map(h => `<option>${esc(h)}</option>`).join(""));
  if (!qWhen && !visible().length) {  // nothing on right now: open on Today instead of an empty screen
    state.when = "today";
    document.querySelectorAll("[data-when]").forEach(x => press(x, x.dataset.when === "today"));
  }
  render();
  setInterval(render, 60_000);  // keep "ends in" badges fresh
});
</script>
</body>
</html>
